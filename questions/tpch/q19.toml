id = "q19"
db = "../../tpch.duckdb"                         # relative to this file
target_sql_file = "../../tpch/queries/q19.sql"
note = "Discounted revenue. Three OR-ed condition blocks, each with its own container list, quantity range and size range."

# The columns that answer the question; the target's other columns are labels.
answer_columns = ["revenue"]

[[levels]]
name = "terse"
prompt = '''
What was the revenue on in-person air deliveries for brands 12, 23 and 34?
'''

[[levels]]
name = "stakeholder"
prompt = '''
I need the revenue (price after discount) on line items shipped by AIR or AIR REG with the instruction DELIVER IN PERSON that fall into any one of three product groups: Brand#12 in small containers (SM CASE, SM BOX, SM PACK, SM PKG) with quantity 1 to 11 and size 1 to 5; Brand#23 in medium containers (MED BAG, MED BOX, MED PKG, MED PACK) with quantity 10 to 20 and size 1 to 10; Brand#34 in large containers (LG CASE, LG BOX, LG PACK, LG PKG) with quantity 20 to 30 and size 1 to 15. All ranges are inclusive. One number.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the fulfillment team:

> Sum extended price * (1 - discount) over line items with ship mode 'AIR' or 'AIR REG' and shipping instruction 'DELIVER IN PERSON' whose part matches at least one of: (a) brand 'Brand#12', container in ('SM CASE', 'SM BOX', 'SM PACK', 'SM PKG'), quantity between 1 and 11, size between 1 and 5; (b) brand 'Brand#23', container in ('MED BAG', 'MED BOX', 'MED PKG', 'MED PACK'), quantity between 10 and 20, size between 1 and 10; (c) brand 'Brand#34', container in ('LG CASE', 'LG BOX', 'LG PACK', 'LG PKG'), quantity between 20 and 30, size between 1 and 15.

Requirements:

- All ranges are inclusive, and each quantity and size range applies only to its own group.
- Return one row with one column: the unrounded revenue.
'''
