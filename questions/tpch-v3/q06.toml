id = "q06v3"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Forecasting revenue change. Revenue is extended price * discount, not * (1 - discount). Half-open year, inclusive discount band. v3 (2026-11-01): all three levels in one file; spec brief without unenforced format rules."
target_sql_file = "../../tpch/queries/q06.sql"

# The columns that answer the question.
answer_columns = ["revenue"]

[[levels]]
name = "terse"
prompt = '''
How much revenue did small discounts on small orders cost us in 1994?
'''

[[levels]]
name = "stakeholder"
prompt = '''
Pricing wants to know how much revenue 1994's discounts cost us on small line items: items shipped in 1994 with a discount between 5% and 7% (inclusive) and a quantity under 24. The amount given away on each item is its list price times its discount. I just need the one total.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the pricing team:

> For line items shipped on or after 1994-01-01 and before 1995-01-01, with discount between 0.05 and 0.07 inclusive and quantity strictly less than 24, compute the sum of extended price * discount.

Requirements:

- Give the total to at least two decimal places.
'''
