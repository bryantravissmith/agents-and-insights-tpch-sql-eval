id = "q04v3"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Late orders by priority. Trap: JOIN lineitem fans out; needs EXISTS / COUNT(DISTINCT). v3 (2026-11-01): all three levels in one file; spec brief without unenforced format rules."
target_sql_file = "../../tpch/queries/q04.sql"

# The columns that answer the question.
answer_columns = ["order_count"]

[[levels]]
name = "terse"
prompt = '''
How many late orders did we have by priority in Q3 1993?
'''

[[levels]]
name = "stakeholder"
prompt = '''
Hey — for the ops review I need a count of late orders by order priority, for orders placed July through September 1993. An order is late if any of its items showed up after the promised date.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the operations team:

> For orders placed on or after 1993-07-01 and before 1993-10-01, how many orders fall into each order priority, counting only orders where at least one line item was received after its committed delivery date? Return one row per priority with the count.

Requirements:

- Each order must be counted at most once, regardless of how many of its line items were late.
'''
