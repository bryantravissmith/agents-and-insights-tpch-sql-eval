id = "q12v3"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Shipping modes and order priority. Two CASE/SUM columns; three date predicates; counts line items, not orders. v3 (2026-11-01): all three levels in one file; spec brief without unenforced format rules."
target_sql_file = "../../tpch/queries/q12.sql"

# The columns that answer the question.
answer_columns = ["high_line_count", "low_line_count"]

[[levels]]
name = "terse"
prompt = '''
In 1994, were late deliveries by mail or by ship hitting our high-priority orders?
'''

[[levels]]
name = "stakeholder"
prompt = '''
Logistics wants to know whether ship mode affects late deliveries of important orders. For MAIL and SHIP line items received in 1994 that were shipped before their committed date but still arrived after it, count the line items on high-priority orders (1-URGENT or 2-HIGH) and the line items on all other orders, per ship mode.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the logistics team:

> Consider line items with ship mode 'MAIL' or 'SHIP', received on or after 1994-01-01 and before 1995-01-01, whose ship date is before the commit date and whose receipt date is after the commit date. For each ship mode, count the line items whose order priority is '1-URGENT' or '2-HIGH', and separately count the line items with any other priority.

Requirements:

- Count line items, not orders.
- Return the ship mode, the high-priority count and the other-priority count.
'''
