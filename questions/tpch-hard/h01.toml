id = "h01"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Hard, novel, first published 2026-10-31. Gaps and islands over calendar months, then a distribution. Traps: treating orders up to 31 days apart as consecutive months, or using the month number without the year, both shift the distribution."
target_sql = '''
WITH m AS (
  SELECT DISTINCT o_custkey, year(o_orderdate) * 12 + month(o_orderdate) AS mi FROM orders),
g AS (
  SELECT o_custkey, mi - row_number() OVER (PARTITION BY o_custkey ORDER BY mi) AS grp FROM m),
runs AS (SELECT o_custkey, count(*) AS len FROM g GROUP BY o_custkey, grp),
longest AS (SELECT o_custkey, max(len) AS longest FROM runs GROUP BY o_custkey)
SELECT longest AS longest_streak_months, count(*) AS customers
FROM longest
GROUP BY longest
ORDER BY longest
'''

# The columns that answer the question; the target's other columns are labels.
answer_columns = ["customers"]

[[levels]]
name = "terse"
prompt = '''
How consistent are our customers? Show how many customers have each longest run of back-to-back ordering months.
'''

[[levels]]
name = "stakeholder"
prompt = '''
I want to understand ordering habits. For every customer who has ever ordered, find their longest streak of consecutive calendar months in which they placed at least one order (for example, orders in March, April and May of the same year make a 3-month streak; December 1995 followed by January 1996 also counts as consecutive). Then give me the distribution: for each streak length, how many customers have that as their longest streak.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the customer insights team:

> For each customer with at least one order, take the set of calendar months (year and month of the order date) in which the customer placed at least one order. A streak is a maximal run of consecutive calendar months in that set, where consecutive means the next month of the calendar, crossing year boundaries (1995-12 is followed by 1996-01). Compute each customer's longest streak length in months. Return, for each distinct longest-streak length, the number of customers whose longest streak has that length. Sort by length ascending.

Requirements:

- Months are calendar months, not 30-day periods or gaps between order dates.
- Each customer contributes exactly once, at their longest streak.
- Return exactly two columns, in this order: longest streak length in months, customer count.
'''
