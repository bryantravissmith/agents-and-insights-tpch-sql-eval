id = "n02v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of n02's terse rung, 2026-11-01: unchanged from v1 (its reference returns only what the terse brief asks), kept so the v2 set has all six questions. Trap: in a LEFT JOIN, a 1997 date filter in WHERE drops the unmatched rows, so testing for a missing order afterwards returns nothing; customers who never ordered at all also count. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
SELECT n_name AS nation, count(*) AS customers_without_1997_orders
FROM customer
JOIN nation ON n_nationkey = c_nationkey
JOIN region ON r_regionkey = n_regionkey
WHERE r_name = 'EUROPE'
  AND NOT EXISTS (SELECT 1 FROM orders WHERE o_custkey = c_custkey
                  AND o_orderdate >= DATE '1997-01-01' AND o_orderdate < DATE '1998-01-01')
GROUP BY n_name
ORDER BY n_name
'''

# The columns that answer the question; the target's other columns are labels.
answer_columns = ["customers_without_1997_orders"]

[[levels]]
name = "terse"
prompt = '''
How many of our European customers didn't order anything in 1997, by country?
'''
