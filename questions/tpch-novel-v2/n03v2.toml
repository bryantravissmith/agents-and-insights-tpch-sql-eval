id = "n03v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of n03's terse rung, 2026-11-01. The terse brief asks who, so the reference returns region and customer only. v1 also returned net line revenue, so agents that ranked by order total failed on the value column even though the three money measures (order total, net or gross line revenue) pick the same five customers. Biggest by number of orders is a different reading, with four-way ties in three regions; it is not accepted. Same trap: region comes from the customer's nation; the supplier's region picks a different customer in four of five regions. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH rev AS (
  SELECT r_name, c_name, sum(l_extendedprice * (1 - l_discount)) AS revenue
  FROM lineitem
  JOIN orders ON o_orderkey = l_orderkey
  JOIN customer ON c_custkey = o_custkey
  JOIN nation ON n_nationkey = c_nationkey
  JOIN region ON r_regionkey = n_regionkey
  WHERE o_orderdate >= DATE '1996-01-01' AND o_orderdate < DATE '1997-01-01'
  GROUP BY r_name, c_custkey, c_name)
SELECT r_name AS region, c_name AS customer
FROM rev
QUALIFY rank() OVER (PARTITION BY r_name ORDER BY revenue DESC) = 1
ORDER BY region
'''

[[levels]]
name = "terse"
prompt = '''
Who was our biggest customer in each region in 1996?
'''
