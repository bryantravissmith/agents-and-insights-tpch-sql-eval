id = "n04v3"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Novel, first published 2026-10-31. Trap: January's change must compare with December 1996 (-20), not be NULL; filtering to 1997 before the LAG loses it. Terse key: The target gives the month as a date; accepted_sql takes the other common forms (timestamp, 'YYYY-MM', month number, full or short month name, 'MM'). No month from December 1996 to December 1997 is empty, so grouping observed months is safe here. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask; an answer that states a different assumption is still graded wrong, and its stated assumptions are kept for review. v3 (2026-11-01): all three levels in one file; spec brief without unenforced format rules."
target_sql = '''
WITH m AS (
  SELECT CAST(date_trunc('month', o_orderdate) AS DATE) AS month, count(*) AS orders
  FROM orders
  WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01'
  GROUP BY 1)
SELECT month, orders, orders - lag(orders) OVER (ORDER BY month) AS change
FROM m
QUALIFY month >= DATE '1997-01-01'
ORDER BY month
'''
# The same answer in other forms.
accepted_sql = [
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS month, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT month, orders, orders - lag(orders) OVER (ORDER BY month) AS change
  FROM m QUALIFY month >= TIMESTAMP '1997-01-01' ORDER BY month
''',
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS m, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT strftime(m, '%Y-%m') AS month, orders, orders - lag(orders) OVER (ORDER BY m) AS change
  FROM m QUALIFY m >= TIMESTAMP '1997-01-01' ORDER BY m
''',
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS m, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT month(m) AS month, orders, orders - lag(orders) OVER (ORDER BY m) AS change
  FROM m QUALIFY m >= TIMESTAMP '1997-01-01' ORDER BY m
''',
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS m, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT strftime(m, '%B') AS month, orders, orders - lag(orders) OVER (ORDER BY m) AS change
  FROM m QUALIFY m >= TIMESTAMP '1997-01-01' ORDER BY m
''',
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS m, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT strftime(m, '%b') AS month, orders, orders - lag(orders) OVER (ORDER BY m) AS change
  FROM m QUALIFY m >= TIMESTAMP '1997-01-01' ORDER BY m
''',
  '''
WITH m AS (
    SELECT date_trunc('month', o_orderdate) AS m, count(*) AS orders
    FROM orders WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01' GROUP BY 1)
  SELECT strftime(m, '%m') AS month, orders, orders - lag(orders) OVER (ORDER BY m) AS change
  FROM m QUALIFY m >= TIMESTAMP '1997-01-01' ORDER BY m
'''
]

# The columns that answer the question.
answer_columns = ["orders", "change"]
# Labels say which row is which; columns in neither list are context, not graded.
label_columns = ["month"]

[[levels]]
name = "terse"
prompt = '''
Monthly order counts for 1997 with the change from the month before?
'''

[[levels]]
name = "stakeholder"
prompt = '''
For the 1997 operations retrospective, give me the number of orders placed in each month of 1997 and how that compares with the previous month (this month minus last month). January should be compared with December 1996, not left blank. Month as YYYY-MM.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the operations team:

> For each calendar month from 1997-01 through 1997-12, count the orders whose order date falls in that month, and compute the change from the previous calendar month as this month's count minus the previous month's count. The previous month of 1997-01 is 1996-12.

Requirements:

- Return the month, order count and change.
'''
