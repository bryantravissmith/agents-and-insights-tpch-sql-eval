id = "n04"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Novel, first published 2026-10-31. Trap: January's change must compare with December 1996 (-20), not be NULL; filtering to 1997 before the LAG loses it."
target_sql = '''
WITH m AS (
  SELECT date_trunc('month', o_orderdate) AS month, count(*) AS orders
  FROM orders
  WHERE o_orderdate >= DATE '1996-12-01' AND o_orderdate < DATE '1998-01-01'
  GROUP BY 1)
SELECT strftime(month, '%Y-%m') AS month, orders, orders - lag(orders) OVER (ORDER BY month) AS change
FROM m
QUALIFY month >= DATE '1997-01-01'
ORDER BY month
'''

[[levels]]
name = "terse"
prompt = '''
Monthly order counts for 1997 with the change from the month before?
'''

[[levels]]
name = "stakeholder"
prompt = '''
For the 1997 operations retrospective, give me the number of orders placed in each month of 1997 and how that compares with the previous month (this month minus last month). January should be compared with December 1996, not left blank. Month as YYYY-MM.
'''

[[levels]]
name = "spec"
prompt = '''
Question from the operations team:

> For each calendar month from 1997-01 through 1997-12, count the orders whose order date falls in that month, and compute the change from the previous calendar month as this month's count minus the previous month's count. The previous month of 1997-01 is 1996-12. Sort by month.

Requirements:

- Format the month as text 'YYYY-MM'.
- Return exactly three columns, in this order: month, order count, change.
'''
