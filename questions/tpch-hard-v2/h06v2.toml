id = "h06v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h06's terse rung, 2026-11-01. The terse brief asks which 5 suppliers, so the reference returns their names; v1 also returned nation, both ranks and the improvement. It does not say which date puts a line item in a year: ship date is the target, and receipt date (the most common choice) and order date are accepted. Same traps: competition ranking (RANK, not DENSE_RANK) within each supplier's own country."
target_sql = '''
WITH rate AS (
  SELECT s_suppkey, s_name, s_nationkey, year(l_shipdate) AS yr,
         count(*) FILTER (WHERE l_receiptdate <= l_commitdate) / count(*) AS on_time
  FROM supplier JOIN lineitem ON l_suppkey = s_suppkey
  WHERE l_shipdate >= DATE '1995-01-01' AND l_shipdate < DATE '1997-01-01'
  GROUP BY ALL),
rk AS (SELECT *, rank() OVER (PARTITION BY s_nationkey, yr ORDER BY on_time DESC) AS rnk FROM rate),
both_years AS (
  SELECT a.s_suppkey, a.s_name, a.rnk - b.rnk AS improvement
  FROM rk a JOIN rk b ON b.s_suppkey = a.s_suppkey AND a.yr = 1995 AND b.yr = 1996)
SELECT s_name AS supplier
FROM both_years
ORDER BY improvement DESC, s_suppkey
LIMIT 5
'''
# The same with the year assigned by receipt date, then by order date.
accepted_sql = [
  '''
WITH rate AS (
  SELECT s_suppkey, s_name, s_nationkey, year(l_receiptdate) AS yr,
         count(*) FILTER (WHERE l_receiptdate <= l_commitdate) / count(*) AS on_time
  FROM supplier JOIN lineitem ON l_suppkey = s_suppkey
  WHERE l_receiptdate >= DATE '1995-01-01' AND l_receiptdate < DATE '1997-01-01'
  GROUP BY ALL),
rk AS (SELECT *, rank() OVER (PARTITION BY s_nationkey, yr ORDER BY on_time DESC) AS rnk FROM rate),
both_years AS (
  SELECT a.s_suppkey, a.s_name, a.rnk - b.rnk AS improvement
  FROM rk a JOIN rk b ON b.s_suppkey = a.s_suppkey AND a.yr = 1995 AND b.yr = 1996)
SELECT s_name AS supplier
FROM both_years
ORDER BY improvement DESC, s_suppkey
LIMIT 5
  ''',
  '''
WITH rate AS (
  SELECT s_suppkey, s_name, s_nationkey, year(o_orderdate) AS yr,
         count(*) FILTER (WHERE l_receiptdate <= l_commitdate) / count(*) AS on_time
  FROM supplier JOIN lineitem ON l_suppkey = s_suppkey
  JOIN orders ON o_orderkey = l_orderkey
  WHERE o_orderdate >= DATE '1995-01-01' AND o_orderdate < DATE '1997-01-01'
  GROUP BY ALL),
rk AS (SELECT *, rank() OVER (PARTITION BY s_nationkey, yr ORDER BY on_time DESC) AS rnk FROM rate),
both_years AS (
  SELECT a.s_suppkey, a.s_name, a.rnk - b.rnk AS improvement
  FROM rk a JOIN rk b ON b.s_suppkey = a.s_suppkey AND a.yr = 1995 AND b.yr = 1996)
SELECT s_name AS supplier
FROM both_years
ORDER BY improvement DESC, s_suppkey
LIMIT 5
  ''',
]

[[levels]]
name = "terse"
prompt = '''
Which 5 suppliers improved their on-time ranking in their country the most from 1995 to 1996?
'''
