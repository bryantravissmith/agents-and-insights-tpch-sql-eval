id = "h06v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h06's terse rung, 2026-11-01: returns the five supplier names, which is what the terse brief asks; v1 also returned nation, both ranks and the improvement. Intended: a line item is on time when it is received on or before its commit date and belongs to the year it shipped; suppliers are ranked within their own country with competition ranking (1, 2, 2, 4); ties in improvement break by supplier key. Most agents assigned the year by receipt date, a reasonable reading that this rubric grades wrong. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH rate AS (
  SELECT s_suppkey, s_name, s_nationkey, year(l_shipdate) AS yr,
         count(*) FILTER (WHERE l_receiptdate <= l_commitdate) / count(*) AS on_time
  FROM supplier JOIN lineitem ON l_suppkey = s_suppkey
  WHERE l_shipdate >= DATE '1995-01-01' AND l_shipdate < DATE '1997-01-01'
  GROUP BY ALL),
rk AS (SELECT *, rank() OVER (PARTITION BY s_nationkey, yr ORDER BY on_time DESC) AS rnk FROM rate),
both_years AS (
  SELECT a.s_suppkey, a.s_name, a.rnk - b.rnk AS improvement
  FROM rk a JOIN rk b ON b.s_suppkey = a.s_suppkey AND a.yr = 1995 AND b.yr = 1996)
SELECT s_name AS supplier
FROM both_years
ORDER BY improvement DESC, s_suppkey
LIMIT 5
'''

[[levels]]
name = "terse"
prompt = '''
Which 5 suppliers improved their on-time ranking in their country the most from 1995 to 1996?
'''
