id = "h01v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h01's terse rung, 2026-11-01: unchanged from v1, whose reference returns only what the terse brief asks; kept so the v2 set has all six questions. Intended: consecutive calendar months, crossing year boundaries, over customers who have ordered. Day gaps (30 or 31 days) instead of calendar months are wrong. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH m AS (
  SELECT DISTINCT o_custkey, year(o_orderdate) * 12 + month(o_orderdate) AS mi FROM orders),
g AS (
  SELECT o_custkey, mi - row_number() OVER (PARTITION BY o_custkey ORDER BY mi) AS grp FROM m),
runs AS (SELECT o_custkey, count(*) AS len FROM g GROUP BY o_custkey, grp),
longest AS (SELECT o_custkey, max(len) AS longest FROM runs GROUP BY o_custkey)
SELECT longest AS longest_streak_months, count(*) AS customers
FROM longest
GROUP BY longest
ORDER BY longest
'''

# The columns that answer the question; the target's other columns are labels.
answer_columns = ["customers"]

[[levels]]
name = "terse"
prompt = '''
How consistent are our customers? Show how many customers have each longest run of back-to-back ordering months.
'''
