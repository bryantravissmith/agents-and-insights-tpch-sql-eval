id = "h03v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h03's terse rung, 2026-11-01: returns nation and the number of customers, which is what the terse brief asks; v1 also returned the customer count and the share covered. Intended: revenue is net line revenue (price after discount) on orders placed in 1995, by the customer's nation, and 'half' means at least half. The order total gives the same counts in every country here, so it passes too. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH rev AS (
  SELECT c_nationkey, c_custkey, sum(l_extendedprice * (1 - l_discount)) AS revenue
  FROM customer JOIN orders ON o_custkey = c_custkey JOIN lineitem ON l_orderkey = o_orderkey
  WHERE o_orderdate >= DATE '1995-01-01' AND o_orderdate < DATE '1996-01-01'
  GROUP BY c_nationkey, c_custkey),
r AS (
  SELECT *, sum(revenue) OVER (PARTITION BY c_nationkey) AS total,
         sum(revenue) OVER (PARTITION BY c_nationkey ORDER BY revenue DESC, c_custkey ROWS UNBOUNDED PRECEDING) AS cum,
         row_number() OVER (PARTITION BY c_nationkey ORDER BY revenue DESC, c_custkey) AS k
  FROM rev)
SELECT n_name AS nation, min(k) AS customers_for_half
FROM r JOIN nation ON n_nationkey = c_nationkey
WHERE cum * 2 >= total
GROUP BY n_name
ORDER BY nation
'''

# The columns that answer the question; the target's other columns are labels.
answer_columns = ["customers_for_half"]

[[levels]]
name = "terse"
prompt = '''
In each country, how few customers make up half our 1995 revenue?
'''
