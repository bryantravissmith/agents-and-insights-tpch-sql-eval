id = "h02v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h02's terse rung, 2026-11-01: returns segment and spree count, the one number the terse brief asks for; v1 also returned two statistics it does not ask for. Intended: a customer's orders in 1996-1997 form one spree while each order comes no more than 30 days after that customer's previous order; a single order is a spree of one; orders outside 1996-1997 neither start nor extend a spree. Most agents assumed a 7-day gap and at least two orders, a reasonable reading of 'orders close together' that this rubric grades wrong. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH o AS (
  SELECT c_mktsegment, o_custkey, o_orderkey, o_orderdate,
         lag(o_orderdate) OVER (PARTITION BY o_custkey ORDER BY o_orderdate, o_orderkey) AS prev
  FROM orders JOIN customer ON c_custkey = o_custkey
  WHERE o_orderdate >= DATE '1996-01-01' AND o_orderdate < DATE '1998-01-01'),
f AS (SELECT *, CASE WHEN prev IS NULL OR o_orderdate - prev > 30 THEN 1 ELSE 0 END AS new_spree FROM o),
s AS (SELECT *, sum(new_spree) OVER (PARTITION BY o_custkey ORDER BY o_orderdate, o_orderkey
                                     ROWS UNBOUNDED PRECEDING) AS spree FROM f),
sp AS (SELECT c_mktsegment, o_custkey, spree FROM s GROUP BY ALL)
SELECT c_mktsegment AS segment, count(*) AS sprees
FROM sp
GROUP BY c_mktsegment
ORDER BY segment
'''

[[levels]]
name = "terse"
prompt = '''
How many buying sprees did each market segment have in 1996-97? A spree is orders close together.
'''
