id = "h05v2"
db = "../../tpch.duckdb"
preamble_file = "../tpch/preamble.md"
note = "Version 2 of h05's terse rung, 2026-11-01: unchanged from v1, whose reference returns what the terse brief asks (active customers and the change, by region and year). Intended: the data ends 1998-08-02, so every year uses the January 1 to August 2 window, and 1993's change is measured against the 1992 window. Leaving 1993's change blank is a reasonable reading of '1993 to 1998' that this rubric grades wrong. Ambiguity, graded by design: the terse brief leaves this open on purpose, and the intended definition is the rubric. An agent that assumes another reasonable definition is graded wrong; the right move is to ask, or to state the assumption, and the final message's assumptions are kept for review, not graded."
target_sql = '''
WITH a AS (
  SELECT r_name, year(o_orderdate) AS yr, count(DISTINCT o_custkey) AS active
  FROM orders JOIN customer ON c_custkey = o_custkey
  JOIN nation ON n_nationkey = c_nationkey JOIN region ON r_regionkey = n_regionkey
  WHERE (month(o_orderdate) < 8 OR (month(o_orderdate) = 8 AND day(o_orderdate) <= 2))
  GROUP BY r_name, yr)
SELECT r_name AS region, yr AS year, active,
       active - lag(active) OVER (PARTITION BY r_name ORDER BY yr) AS change
FROM a
QUALIFY yr >= 1993
ORDER BY region, year
'''

[[levels]]
name = "terse"
prompt = '''
Active customers by region, year over year, 1993 to 1998. Make sure 1998 is comparable.
'''
